services:
  hermes:
    build:
      context: .
      args:
        HERMES_GIT_REF: main
    environment:
      PORT: "3000"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS}
      TELEGRAM_ALLOW_ALL_USERS: ${TELEGRAM_ALLOW_ALL_USERS}
      TELEGRAM_HOME_CHANNEL: ${TELEGRAM_HOME_CHANNEL}
      TELEGRAM_HOME_CHANNEL_NAME: ${TELEGRAM_HOME_CHANNEL_NAME}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_ALLOWED_USERS: ${DISCORD_ALLOWED_USERS}
      DISCORD_ALLOW_ALL_USERS: ${DISCORD_ALLOW_ALL_USERS}
      DISCORD_HOME_CHANNEL: ${DISCORD_HOME_CHANNEL}
      DISCORD_HOME_CHANNEL_NAME: ${DISCORD_HOME_CHANNEL_NAME}
      DISCORD_REQUIRE_MENTION: ${DISCORD_REQUIRE_MENTION}
      DISCORD_FREE_RESPONSE_CHANNELS: ${DISCORD_FREE_RESPONSE_CHANNELS}
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_APP_TOKEN: ${SLACK_APP_TOKEN}
      SLACK_ALLOWED_USERS: ${SLACK_ALLOWED_USERS}
      SLACK_ALLOW_ALL_USERS: ${SLACK_ALLOW_ALL_USERS}
      SLACK_HOME_CHANNEL: ${SLACK_HOME_CHANNEL}
      SLACK_HOME_CHANNEL_NAME: ${SLACK_HOME_CHANNEL_NAME}
      RADIUS_PRIVATE_KEY: ${RADIUS_PRIVATE_KEY}
      RADIUS_WALLET_ADDRESS: ${RADIUS_WALLET_ADDRESS}
      RADIUS_NETWORK: ${RADIUS_NETWORK}
      RADIUS_AUTO_FUND: ${RADIUS_AUTO_FUND}
      LINEAR_API_KEY: ${LINEAR_API_KEY}
      LINEAR_TEAM_ID: ${LINEAR_TEAM_ID}
      LINEAR_PROJECT_ID: ${LINEAR_PROJECT_ID}
      BYTEROVER_API_KEY: ${BYTEROVER_API_KEY}
      BYTEROVER_LOCAL: ${BYTEROVER_LOCAL}
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      FAL_KEY: ${FAL_KEY}
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY}
      VOICE_TOOLS_OPENAI_KEY: ${VOICE_TOOLS_OPENAI_KEY}
      BROWSERBASE_API_KEY: ${BROWSERBASE_API_KEY}
      BROWSERBASE_PROJECT_ID: ${BROWSERBASE_PROJECT_ID}
      BROWSERBASE_PROXIES: ${BROWSERBASE_PROXIES}
      BROWSERBASE_ADVANCED_STEALTH: ${BROWSERBASE_ADVANCED_STEALTH}
      NOUS_API_KEY: ${NOUS_API_KEY}
      TINKER_API_KEY: ${TINKER_API_KEY}
      WANDB_API_KEY: ${WANDB_API_KEY}
      RL_API_URL: ${RL_API_URL}
      TERMINAL_BACKEND: ${TERMINAL_BACKEND}
      TERMINAL_CWD: ${TERMINAL_CWD}
      TERMINAL_TIMEOUT: ${TERMINAL_TIMEOUT}
      TERMINAL_LIFETIME_SECONDS: ${TERMINAL_LIFETIME_SECONDS}
      TERMINAL_DOCKER_IMAGE: ${TERMINAL_DOCKER_IMAGE}
      TERMINAL_SINGULARITY_IMAGE: ${TERMINAL_SINGULARITY_IMAGE}
      TERMINAL_MODAL_IMAGE: ${TERMINAL_MODAL_IMAGE}
      TERMINAL_CONTAINER_CPU: ${TERMINAL_CONTAINER_CPU}
      TERMINAL_CONTAINER_MEMORY: ${TERMINAL_CONTAINER_MEMORY}
      TERMINAL_CONTAINER_DISK: ${TERMINAL_CONTAINER_DISK}
      TERMINAL_CONTAINER_PERSISTENT: ${TERMINAL_CONTAINER_PERSISTENT}
      TERMINAL_SANDBOX_DIR: ${TERMINAL_SANDBOX_DIR}
      TERMINAL_SSH_HOST: ${TERMINAL_SSH_HOST}
      TERMINAL_SSH_USER: ${TERMINAL_SSH_USER}
    volumes:
    - hermes-data:/data
    restart: unless-stopped
    expose:
    - "3000"
volumes:
  hermes-data:
